[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "georgian-dictation"
version = "1.3.0"
description = "Open-source Windows dictation for Georgian with local/cloud STT and optional AI text processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["georgian", "dictation", "speech-to-text", "asr", "windows", "accessibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6==6.11.2",
  "numpy==2.5.3",
  "sounddevice==0.5.6",
  "platformdirs==4.11.8",
  "cffi==2.1.1",
  "websocket-client==1.9.2",
  "google-genai==2.23.0",
  "google-auth==2.59.1",
]

[project.scripts]
georgian-dictation = "georgian_dictation.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["georgian_dictation*"]

[tool.setuptools.package-data]
georgian_dictation = ["models/*.json"]
